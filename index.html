<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --page-bg: transparent;
            --text-primary: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.8);
            --text-placeholder: rgba(255, 255, 255, 0.6);
            --surface: rgba(0, 0, 0, 0.55);
            --surface-strong: rgba(0, 0, 0, 0.75);
            --surface-active: rgba(0, 0, 0, 0.65);
            --surface-hover: rgba(255, 255, 255, 0.15);
            --surface-soft: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.12);
            --border-strong: rgba(255, 255, 255, 0.16);
            --scrollbar-thumb: rgba(255, 255, 255, 0.2);
            --button-bg: rgba(0, 0, 0, 0.45);
            --close-bg: rgba(255, 78, 78, 0.9);
            --close-hover-bg: rgba(255, 78, 78, 1);
            --send-gradient: linear-gradient(135deg, #ff6b6b, #ffcc33);
            --send-text: #000000;
            --bubble-gradient: linear-gradient(135deg, rgba(63, 163, 255, 0.96), rgba(141, 105, 255, 0.95));
            --gift-bg: rgba(212, 160, 0, 0.75);
            --gift-text: #000000;
            --guard-bg: rgba(0, 116, 204, 0.8);
            --guard-text: #ffffff;
            --medal-text: #ff69b4;
            --name-text: #00eaff;
            --gift-medal-text: #990000;
            --shadow: rgba(0, 0, 0, 0.18);
            --bubble-shadow: rgba(0, 0, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--page-bg);
        }

        body {
            /* 【修改1】清除左右白边，仅保留底部少量间距防止内容被遮挡 */
            margin: 0;
            padding: 0 0 72px;
            font-size: 15px;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-y: hidden;
            background: var(--page-bg);
        }

        #window-controls {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            gap: 6px;
        }

        .window-button {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-strong);
            border-radius: 50%;
            background: var(--button-bg);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .window-button:hover {
            background: var(--surface-hover);
            transform: translateY(-1px);
        }

        .window-button.close {
            background: var(--close-bg);
        }

        .window-button.close:hover {
            background: var(--close-hover-bg);
        }

        #close-btn {
            display: none;
        }

        #close-btn:hover {
            transform: translateY(-1px);
            background: var(--surface-strong);
        }

        #close-btn:active {
            transform: translateY(0);
            background: var(--surface-active);
        }

        #settings-overlay {
            position: fixed;
            inset: 0;
            z-index: 1200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(8px);
        }

        #settings-panel {
            width: min(360px, 100%);
            max-height: calc(100vh - 36px);
            overflow-y: auto;
            padding: 18px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            background: var(--surface-strong);
            color: var(--text-primary);
            box-shadow: 0 18px 44px var(--shadow);
        }

        .settings-title {
            margin-bottom: 14px;
            font-size: 1rem;
            font-weight: 700;
        }

        .settings-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .settings-field input,
        .settings-field select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-soft);
            color: var(--text-primary);
            outline: none;
        }

        .settings-section-required {
            margin-bottom: 16px;
            padding: 12px;
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            background: var(--surface-soft);
        }

        .settings-section-label {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .settings-required-mark {
            color: #ff6b6b;
            font-weight: 700;
        }

        .settings-field-hint {
            margin-top: 6px;
            font-size: 0.78rem;
            line-height: 1.4;
            color: var(--text-muted);
        }

        .settings-feature-block {
            margin-bottom: 4px;
        }

        .settings-nested {
            margin: 4px 0 10px 24px;
            padding: 10px 12px;
            border-left: 2px solid var(--border);
            border-radius: 0 8px 8px 0;
            background: var(--surface-soft);
        }

        .settings-nested.is-disabled {
            opacity: 0.45;
            pointer-events: none;
        }

        .settings-field-nested {
            margin-bottom: 0;
        }

        .settings-field-nested input:disabled,
        .settings-check input:disabled {
            cursor: not-allowed;
        }

        .settings-group-title {
            margin: 16px 0 10px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .settings-check {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 9px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .settings-check input {
            width: 16px;
            height: 16px;
            accent-color: var(--name-text);
        }

        .settings-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        .settings-action {
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 9px 14px;
            cursor: pointer;
            background: var(--surface-soft);
            color: var(--text-primary);
            font-weight: 700;
        }

        .settings-action.primary {
            border: none;
            background: var(--send-gradient);
            color: var(--send-text);
        }

        #settings-status {
            min-height: 18px;
            margin-top: 10px;
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        #list {
            /* 【修改2】清除列表与发送框之间的垂直白边 */
            margin-bottom: 0;
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) transparent;
        }

        #list::-webkit-scrollbar {
            width: 6px;
        }

        #list::-webkit-scrollbar-track {
            background: transparent;
        }

        #list::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar-thumb);
            border-radius: 6px;
        }

        /* 【修改3】发送框全屏贴边，清除左右白边，调整圆角适配贴边样式 */
        #danmu-box {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 999;
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            /* 底部直角贴合屏幕，仅保留顶部圆角，视觉更协调 */
            border-radius: 12px 12px 0 0;
            backdrop-filter: blur(12px);
        }

        #danmu-input {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface-soft);
            color: var(--text-primary);
            outline: none;
            font-size: 0.95rem;
        }

        #danmu-input::placeholder {
            color: var(--text-placeholder);
        }

        #danmu-send-btn {
            border: none;
            background: var(--send-gradient);
            color: var(--send-text);
            border-radius: 999px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 10px 24px var(--shadow);
        }

        #danmu-send-btn:hover {
            opacity: 0.95;
        }

        /* 【修改4】同步调整状态提示文字位置，避免与发送框重叠 */
        #danmu-status {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 58px;
            z-index: 998;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            pointer-events: none;
        }

        /* 【修改5】同步调整回到底部按钮位置 */
        #scroll-to-bottom {
            position: fixed;
            bottom: 64px;
            right: 12px;
            z-index: 1000;
            display: none;
            /* 默认隐藏 */
        }

        .danmu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 0;
            margin-bottom: 10px;
            animation: fadeIn 0.25s ease;
            color: var(--text-primary);
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
        }

        .danmu-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-strong);
            flex-shrink: 0;
            background: var(--surface-soft);
        }

        .danmu-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .danmu-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0;
            font-size: 0.95rem;
        }

        .danmu-bubble {
            background: var(--bubble-gradient);
            border-radius: 18px;
            padding: 10px 14px;
            word-break: break-word;
            line-height: 1.5;
            box-shadow: 0 10px 24px var(--bubble-shadow);
            background-clip: padding-box;
            /* 新增：字体抗锯齿，弱化边缘彩边 */
            -webkit-font-smoothing: antialiased;
            /* 新增：硬件加速，减少重复渲染残影 */
            will-change: transform;
        }

        .gift-item {
            background: var(--gift-bg);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease;
            color: var(--gift-text);
        }

        .medal {
            color: var(--medal-text);
            margin-right: 6px;
        }

        .name {
            color: var(--name-text);
            margin-right: 6px;
        }

        .gift-medal {
            color: var(--gift-medal-text);
            margin-right: 6px;
        }

        .guard-item {
            background: var(--guard-bg);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease;
            color: var(--guard-text);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div id="window-controls">
        <button class="window-button" title="最小化" onclick="minimizeApp()">─</button>
        <button class="window-button" title="设置" onclick="openSettings()">⚙</button>
        <button class="window-button close" title="关闭" onclick="closeApp()">×</button>
    </div>
    <div id="settings-overlay" onclick="handleSettingsOverlayClick(event)">
        <div id="settings-panel">
            <div class="settings-title">设置</div>
            <div class="settings-section-required">
                <label class="settings-section-label" for="setting-room-id">
                    直播间 ID
                    <span class="settings-required-mark">*</span>
                </label>
                <input id="setting-room-id" type="number" inputmode="numeric" required placeholder="例如 1879006019">
                <div class="settings-field-hint">必填。QQ 群绑定等功能都关联到此房间 ID。</div>
            </div>
            <label class="settings-field">
                主题
                <select id="setting-theme"></select>
            </label>
            <div class="settings-group-title">功能开关</div>
            <label class="settings-check"><input id="setting-enable-danmaku" type="checkbox">弹幕监听</label>
            <label class="settings-check"><input id="setting-enable-guard-buy" type="checkbox">大航海续费</label>
            <label class="settings-check"><input id="setting-enable-super-chat" type="checkbox">超级留言</label>
            <div class="settings-feature-block">
                <label class="settings-check">
                    <input id="setting-enable-live-start" type="checkbox" onchange="syncLiveStartOptions()">
                    开播通知
                </label>
                <div id="live-start-options" class="settings-nested is-disabled">
                    <label class="settings-check">
                        <input id="setting-enable-qq-notification" type="checkbox" onchange="syncLiveStartOptions()">
                        推送到 QQ 群
                    </label>
                    <label class="settings-field settings-field-nested">
                        QQ 群号
                        <input id="setting-group-id" type="text" inputmode="numeric" placeholder="例如 1093523827">
                        <div class="settings-field-hint">仅对上方直播间 ID 生效，留空则不推送。</div>
                    </label>
                </div>
            </div>
            <label class="settings-check"><input id="setting-enable-gift" type="checkbox">礼物消息</label>
            <label class="settings-check"><input id="setting-web-debug" type="checkbox">Web 调试</label>
            <div id="settings-status"></div>
            <div class="settings-actions">
                <button class="settings-action" type="button" onclick="closeSettings()">取消</button>
                <button class="settings-action primary" type="button" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>
    <div id="list"></div>
    <button id="scroll-to-bottom" class="window-button" title="回到底部" onclick="scrollToBottom()">↓</button>
    <div id="danmu-box">
        <input id="danmu-input" type="text" placeholder="输入弹幕后按 Enter 发送" autocomplete="off"
            onkeydown="handleDanmuKeydown(event)">
        <button id="danmu-send-btn" onclick="handleSendDanmu()">发送</button>
    </div>
    <div id="danmu-status"></div>
    <script>
        const themeVarMap = {
            pageBg: '--page-bg',
            textPrimary: '--text-primary',
            textMuted: '--text-muted',
            textPlaceholder: '--text-placeholder',
            surface: '--surface',
            surfaceStrong: '--surface-strong',
            surfaceActive: '--surface-active',
            surfaceHover: '--surface-hover',
            surfaceSoft: '--surface-soft',
            border: '--border',
            borderStrong: '--border-strong',
            scrollbarThumb: '--scrollbar-thumb',
            buttonBg: '--button-bg',
            closeBg: '--close-bg',
            closeHoverBg: '--close-hover-bg',
            sendGradient: '--send-gradient',
            sendText: '--send-text',
            bubbleGradient: '--bubble-gradient',
            giftBg: '--gift-bg',
            giftText: '--gift-text',
            guardBg: '--guard-bg',
            guardText: '--guard-text',
            medalText: '--medal-text',
            nameText: '--name-text',
            giftMedalText: '--gift-medal-text',
            shadow: '--shadow',
            bubbleShadow: '--bubble-shadow'
        };
        let latestFrontendConfig = null;

        const featureSettingMap = {
            enable_danmaku: 'setting-enable-danmaku',
            enable_guard_buy: 'setting-enable-guard-buy',
            enable_super_chat: 'setting-enable-super-chat',
            enable_live_start: 'setting-enable-live-start',
            enable_gift: 'setting-enable-gift',
            web_debug: 'setting-web-debug'
        };

        function applyThemeColors(colors) {
            Object.entries(themeVarMap).forEach(([key, cssVar]) => {
                if (typeof colors[key] === 'string' && colors[key].trim()) {
                    document.documentElement.style.setProperty(cssVar, colors[key].trim());
                }
            });
        }

        async function loadTheme() {
            try {
                if (!window.pywebview || !window.pywebview.api || typeof window.pywebview.api.getFrontendConfig !== 'function') {
                    return;
                }

                const frontendConfig = await window.pywebview.api.getFrontendConfig();
                latestFrontendConfig = frontendConfig;
                const colors = frontendConfig && frontendConfig.theme ? frontendConfig.theme.colors : {};
                applyThemeColors(colors);
            } catch (error) {
                console.warn('前端配置读取失败，使用默认配色：', error);
            }
        }

        if (window.pywebview) {
            loadTheme();
        } else {
            window.addEventListener('pywebviewready', loadTheme);
        }

        window.onerror = function (message, source, lineno, colno, error) {
            console.error('前端错误：', message, source, lineno, colno, error);
        };

        document.addEventListener('DOMContentLoaded', function () {
            const list = document.getElementById('list');
            list.addEventListener('scroll', checkScrollBottom);

            // 【核心修改6】页面加载完成后 默认自动滚动到弹幕底部（延时确保DOM渲染完成）
            setTimeout(() => {
                list.scrollTop = list.scrollHeight;
                checkScrollBottom(); // 初始化检测：底部状态 → 隐藏回到底部按钮
            }, 50);
        });

        async function closeApp() {
            if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.closeWindow === 'function') {
                try {
                    await window.pywebview.api.closeWindow();
                } catch (e) {
                    console.error('关闭窗口失败：', e);
                }
            } else {
                window.close();
            }
        }

        function showDanmuStatus(message, duration = 2400) {
            const status = document.getElementById('danmu-status');
            status.textContent = message;
            if (duration > 0) {
                setTimeout(() => {
                    status.textContent = '';
                }, duration);
            }
        }

        function minimizeApp() {
            if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.minimizeWindow === 'function') {
                window.pywebview.api.minimizeWindow();
            }
        }

        async function openSettings() {
            const overlay = document.getElementById('settings-overlay');
            const status = document.getElementById('settings-status');
            overlay.style.display = 'flex';
            status.textContent = '';

            if (!latestFrontendConfig) {
                await loadTheme();
            }

            renderSettings(latestFrontendConfig || {});
        }

        function closeSettings() {
            document.getElementById('settings-overlay').style.display = 'none';
        }

        function handleSettingsOverlayClick(event) {
            if (event.target.id === 'settings-overlay') {
                closeSettings();
            }
        }

        function getCurrentRoomBinding(config) {
            const roomId = String(config.LESSONROOMID || '').trim();
            const bindings = config.room_bindings || {};
            return bindings[roomId] || {};
        }

        function syncLiveStartOptions() {
            const liveStartEnabled = document.getElementById('setting-enable-live-start').checked;
            const qqNotificationEnabled = document.getElementById('setting-enable-qq-notification').checked;
            const nested = document.getElementById('live-start-options');
            const qqCheckbox = document.getElementById('setting-enable-qq-notification');
            const groupInput = document.getElementById('setting-group-id');

            nested.classList.toggle('is-disabled', !liveStartEnabled);
            qqCheckbox.disabled = !liveStartEnabled;
            groupInput.disabled = !liveStartEnabled || !qqNotificationEnabled;

            if (!liveStartEnabled) {
                qqCheckbox.checked = false;
            }
        }

        function renderSettings(frontendConfig) {
            const config = frontendConfig.config || {};
            const frontend = config.frontend || {};
            const features = config.features || {};
            const roomBinding = getCurrentRoomBinding(config);
            const themeSelect = document.getElementById('setting-theme');

            document.getElementById('setting-room-id').value = config.LESSONROOMID || '';
            document.getElementById('setting-group-id').value = roomBinding.GROUPID || '';
            themeSelect.innerHTML = '';
            (frontendConfig.themeOptions || []).forEach((option) => {
                const item = document.createElement('option');
                item.value = option.value;
                item.textContent = option.label;
                themeSelect.appendChild(item);
            });
            themeSelect.value = frontend.theme || (frontendConfig.theme && frontendConfig.theme.name) || 'default';

            Object.entries(featureSettingMap).forEach(([key, id]) => {
                document.getElementById(id).checked = Boolean(features[key]);
            });
            document.getElementById('setting-enable-qq-notification').checked = Boolean(
                roomBinding.enable_qq_notification ?? features.enable_qq_notification
            );
            syncLiveStartOptions();
        }

        function collectSettings() {
            const roomId = document.getElementById('setting-room-id').value.trim();
            const liveStartEnabled = document.getElementById('setting-enable-live-start').checked;
            const qqNotificationEnabled = liveStartEnabled && document.getElementById('setting-enable-qq-notification').checked;
            const features = {};
            Object.entries(featureSettingMap).forEach(([key, id]) => {
                features[key] = document.getElementById(id).checked;
            });

            return {
                LESSONROOMID: roomId,
                GROUPID: qqNotificationEnabled ? document.getElementById('setting-group-id').value.trim() : '',
                frontend: {
                    theme: document.getElementById('setting-theme').value
                },
                enable_qq_notification: qqNotificationEnabled,
                features
            };
        }

        async function saveSettings() {
            const status = document.getElementById('settings-status');
            const roomId = document.getElementById('setting-room-id').value.trim();
            if (!roomId) {
                status.textContent = '请先填写直播间 ID';
                document.getElementById('setting-room-id').focus();
                return;
            }

            const liveStartEnabled = document.getElementById('setting-enable-live-start').checked;
            const qqNotificationEnabled = document.getElementById('setting-enable-qq-notification').checked;
            const groupId = document.getElementById('setting-group-id').value.trim();
            if (liveStartEnabled && qqNotificationEnabled && !groupId) {
                status.textContent = '开启 QQ 推送时请填写群号';
                document.getElementById('setting-group-id').focus();
                return;
            }

            status.textContent = '保存中...';

            try {
                if (!window.pywebview || !window.pywebview.api || typeof window.pywebview.api.saveFrontendConfig !== 'function') {
                    status.textContent = '后端配置接口不可用';
                    return;
                }

                const result = await window.pywebview.api.saveFrontendConfig(collectSettings());
                if (!result || !result.ok) {
                    status.textContent = '保存失败：' + (result && result.error ? result.error : '未知错误');
                    return;
                }

                latestFrontendConfig = result.frontendConfig;
                if (latestFrontendConfig && latestFrontendConfig.theme) {
                    applyThemeColors(latestFrontendConfig.theme.colors || {});
                }
                renderSettings(latestFrontendConfig || {});
                status.textContent = '已保存，部分监听配置重启后完全生效';
            } catch (error) {
                console.error('保存配置失败：', error);
                status.textContent = '保存失败：后端调用异常';
            }
        }

        function handleSendDanmu() {
            const input = document.getElementById('danmu-input');
            const text = input.value.trim();
            if (!text) {
                showDanmuStatus('请输入弹幕内容');
                return;
            }

            if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.sendDanmu === 'function') {
                window.pywebview.api.sendDanmu(text).then((result) => {
                    if (result && result.ok) {
                        showDanmuStatus('弹幕已发送');
                        input.value = '';
                    } else {
                        showDanmuStatus('发送失败：' + (result && result.error ? result.error : '未知错误'));
                    }
                }).catch((error) => {
                    console.error('sendDanmu 调用失败：', error);
                    showDanmuStatus('发送失败：后端调用异常');
                });
            } else {
                showDanmuStatus('后端发送接口不可用');
            }
        }

        function handleDanmuKeydown(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                handleSendDanmu();
            }
        }

        function scrollToBottom() {
            const list = document.getElementById('list');
            list.scrollTop = list.scrollHeight;
            document.getElementById('scroll-to-bottom').style.display = 'none';
        }

        // 滚动状态检测：仅离开底部时显示按钮，回到底部自动隐藏
        function checkScrollBottom() {
            const list = document.getElementById('list');
            const scrollBtn = document.getElementById('scroll-to-bottom');
            // 预留10px误差，兼容浏览器滚动像素偏差
            const isAtBottom = list.scrollTop + list.clientHeight >= list.scrollHeight - 10;
            scrollBtn.style.display = isAtBottom ? 'none' : 'inline-flex';
        }

        function addDanmu(data) {
            console.log('addDanmu 接收到数据：', data);
            const list = document.getElementById('list');
            const div = document.createElement('div');

            if (data.type === "danmu") {
                div.className = "danmu-item";

                if (data.avatar_url) {
                    const avatar = document.createElement('img');
                    avatar.className = 'danmu-avatar';
                    avatar.src = data.avatar_url;
                    avatar.alt = '头像';
                    avatar.onerror = function () {
                        this.style.display = 'none';
                    };
                    div.appendChild(avatar);
                }

                const body = document.createElement('div');
                body.className = 'danmu-body';

                const header = document.createElement('div');
                header.className = 'danmu-header';

                const medal = document.createElement('span');
                medal.className = 'medal';
                medal.textContent = `[${data.medal_name}·${data.medal_level}]`;
                header.appendChild(medal);

                const name = document.createElement('span');
                name.className = 'name';
                name.textContent = data.username;
                header.appendChild(name);

                const bubble = document.createElement('div');
                bubble.className = 'danmu-bubble';
                bubble.textContent = data.content;

                body.appendChild(header);
                body.appendChild(bubble);
                div.appendChild(body);
            } else if (data.type === "gift") {
                div.className = "gift-item";
                div.innerHTML = `
                    <div class="gift-header">
                        <span class="gift-medal">[${data.medal_name}·${data.medal_level}]</span>
                        <span class="name">${data.username}</span>
                        <span class="type-label">礼物</span>
                    </div>
                    <div class="content">
                    赠送 ×${data.gift_num}【${data.gift_name}】 · ${data.paid_coin / 1000} 元
                    ${data.paid_coin && data.paid_coin !== data.total_coin ? '（花费 ' + (data.total_coin / 1000) + ' 元）' : ''}
                </div>
                `;
            } else if (data.type === "GUARD_BUY") {
                div.className = "guard-item";
                div.innerHTML = `
                    <div class="guard-header">
                        <span class="gift-medal">[${data.medal_name}·${data.medal_level}]</span>
                        <span class="name">${data.username}</span>
                        <span class="type-label">续费</span>
                    </div>
                    <div class="content">续费大航海 ${data.guard_level || ''}${data.guard_name ? ' ' + data.guard_name : ''}</div>
                `;
            }

            list.appendChild(div);
            // 限制最多保留100条弹幕，避免内存溢出
            while (list.children.length > 100) {
                list.removeChild(list.firstChild);
            }

            // 新消息自动滚动到底部
            list.scrollTop = list.scrollHeight;
            checkScrollBottom();
        }
    </script>
</body>

</html>
