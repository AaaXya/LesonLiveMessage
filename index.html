<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            padding: 10px;
            font-size: 15px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 100vh;
        }

        /* 普通弹幕样式 */
        .danmu-item {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease;
        }

        /* 礼物高亮样式（金色） */
        .gift-item {
            background: rgba(212, 160, 0, 0.75);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease;
            color: #000;
        }

        .medal {
            color: #ff69b4;
            margin-right: 6px;
        }

        .name {
            color: #00eaff;
            margin-right: 6px;
        }

        .gift-medal {
            color: #990000;
            margin-right: 6px;
        }

        /* 大航海续费样式 */
        .guard-item {
            background: rgba(0, 116, 204, 0.8);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            animation: fadeIn 0.3s ease;
            color: #fff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div id="list"></div>
    <script>
        function addDanmu(data) {
            const list = document.getElementById('list');
            const div = document.createElement('div');

            // 判断类型，切换样式
            if (data.type === "danmu") {
                div.className = "danmu-item";
                div.innerHTML = `
                    <span class="medal">[${data.medal_name}·${data.medal_level}]</span>
                    <span class="name">${data.username}</span>：${data.content}
                `;
            } else if (data.type === "gift") {
                div.className = "gift-item";
                div.innerHTML = `
                    <span class="gift-medal">[${data.medal_name}·${data.medal_level}]</span>
                    <span>${data.username} 赠送 ×${data.gift_num}【${data.gift_name}】 | ${data.total_coin / 1000}元</span>
                `;
            } else if (data.type === "GUARD_BUY") {
                div.className = "guard-item";
                div.innerHTML = `
                    <span class="gift-medal">[${data.medal_name}·${data.medal_level}]</span>
                    <span>${data.username} 续费大航海 ${data.guard_level || ''}${data.guard_name ? ' ' + data.guard_name : ''}</span>
                `;
            }

            list.appendChild(div);
            // 最多保留100条消息，超出删除最顶部
            while (list.children.length > 100) {
                list.removeChild(list.firstChild);
            }
        }
    </script>
</body>

</html>
